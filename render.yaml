# Render Blueprint — backend API only
# Docs: https://render.com/docs/blueprint-spec
#
# Frontends (student + admin) deploy on Vercel — see docs/operations/deploy.md
#
# Free web services spin down after ~15 min idle (cold start ~30–60s).
# Wake the API once before a live demo: GET /api/health

services:
  - type: web
    name: cadt-events-api
    runtime: node
    plan: free
    rootDir: backend
    # Install prod+dev so TypeScript build tools are present; prisma is also in dependencies for migrate
    buildCommand: npm ci --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically
      # Set secrets in the Render dashboard — do not commit real values
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Point at Vercel production URLs (CORS)
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
